name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug artifacts
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-parallel --stacktrace

      # Keep lint variants isolated. Running debug/release Hilt generation beside
      # test-source lint can race inside Android lint's generated-source index.
      - name: Lint debug sources
        run: ./gradlew lintDebug --no-parallel --stacktrace

      - name: Lint release sources
        run: ./gradlew lintRelease --no-parallel --stacktrace

      - name: Build unsigned release artifacts
        run: ./gradlew assembleRelease bundleRelease --no-parallel --stacktrace

      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohmusic-ci-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
